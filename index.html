<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echo Music Web</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #08080d;
            --bg-secondary: #11111a;
            --bg-card: rgba(255, 255, 255, 0.055);
            --bg-card-hover: rgba(255, 255, 255, 0.09);

            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --pink: #ec4899;

            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;

            --border: rgba(255, 255, 255, 0.09);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -10;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.28;
            animation: float 20s infinite ease-in-out;
        }

        .blob.one {
            width: 450px;
            height: 450px;
            background: #7c3aed;
            top: -180px;
            right: -150px;
        }

        .blob.two {
            width: 350px;
            height: 350px;
            background: #ec4899;
            bottom: -120px;
            left: -120px;
            animation-delay: -7s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -30px) scale(1.08);
            }
        }

        /* App */

        .app {
            width: 100%;
            max-width: 720px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 170px;
        }

        /* Header */

        header {
            padding: 25px 20px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            background: linear-gradient(
                135deg,
                #a78bfa,
                #ec4899
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .version {
            font-size: 11px;
            color: var(--text-muted);
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
        }

        /* Backend status */

        .backend-status {
            margin: 0 20px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px rgba(16,185,129,.5);
        }

        .status-dot.error {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239,68,68,.5);
        }

        /* Search */

        .search-container {
            padding: 0 20px 25px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-box {
            width: 100%;
            height: 54px;
            padding: 0 55px 0 20px;

            border: 1px solid var(--border);
            border-radius: 18px;

            outline: none;

            background: rgba(255,255,255,.055);
            color: white;

            font-family: inherit;
            font-size: 15px;

            transition: .25s;
        }

        .search-box::placeholder {
            color: #777b87;
        }

        .search-box:focus {
            border-color: rgba(124,58,237,.7);
            background: rgba(124,58,237,.08);
            box-shadow: 0 0 0 4px rgba(124,58,237,.08);
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-btn {
            width: 100%;
            height: 50px;
            margin-top: 12px;

            border: none;
            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #ec4899
            );

            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }

        .search-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .search-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        /* Content */

        .content {
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
        }

        .result-count {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* Song list */

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 10px;

            border: 1px solid rgba(255,255,255,.045);
            border-radius: 16px;

            background: var(--bg-card);

            cursor: pointer;

            transition: .2s;
        }

        .song-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(3px);
        }

        .song-item.active {
            background: rgba(124,58,237,.19);
            border-color: rgba(124,58,237,.45);
        }

        .song-art {
            width: 58px;
            height: 58px;

            flex-shrink: 0;

            border-radius: 12px;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #ec4899
            );

            font-size: 22px;
        }

        .song-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            margin-top: 5px;

            font-size: 12px;
            color: var(--text-secondary);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-play {
            width: 36px;
            height: 36px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,.08);
            color: white;

            flex-shrink: 0;
        }

        .song-item.active .song-play {
            background: var(--accent);
        }

        /* Loading */

        .loading {
            text-align: center;
            padding: 45px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .spinner {
            width: 28px;
            height: 28px;

            margin: 0 auto 12px;

            border-radius: 50%;

            border: 3px solid rgba(255,255,255,.12);
            border-top-color: var(--accent);

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */

        .error {
            padding: 16px;

            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.3);

            border-radius: 14px;

            color: #fca5a5;

            text-align: center;

            font-size: 13px;
        }

        /* Player */

        .player {
            position: fixed;

            left: 50%;
            bottom: 15px;

            transform: translateX(-50%);

            width: min(680px, calc(100% - 24px));

            background: rgba(20,20,30,.97);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid var(--border);

            border-radius: 22px;

            box-shadow:
                0 20px 70px rgba(0,0,0,.6);

            z-index: 100;

            display: none;

            overflow: hidden;
        }

        .player.active {
            display: block;
        }

        /* YouTube container */

        .youtube-container {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            display: none;
        }

        .youtube-container.visible {
            display: block;
        }

        #youtubePlayer {
            width: 100%;
            height: 100%;
        }

        .close-video {
            position: absolute;

            top: 10px;
            right: 10px;

            width: 34px;
            height: 34px;

            border: none;
            border-radius: 50%;

            background: rgba(0,0,0,.7);
            color: white;

            cursor: pointer;

            z-index: 5;
        }

        /* Player info */

        .player-main {
            padding: 13px 15px 10px;

            display: flex;
            align-items: center;

            gap: 12px;
        }

        .player-art {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            border-radius: 10px;

            overflow: hidden;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #ec4899
            );
        }

        .player-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-title {
            font-size: 14px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 12px;
            color: var(--text-secondary);

            margin-top: 3px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .player-btn {
            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,.08);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: .2s;
        }

        .player-btn:hover {
            background: rgba(255,255,255,.15);
        }

        .player-btn.primary {
            width: 44px;
            height: 44px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #ec4899
            );
        }

        /* Progress */

        .progress-container {
            padding: 0 15px 5px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;

            background: rgba(255,255,255,.12);

            border-radius: 10px;

            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #ec4899
            );
        }

        .time-row {
            display: flex;
            justify-content: space-between;

            margin-top: 5px;

            color: var(--text-muted);

            font-size: 10px;
        }

        /* Bottom controls */

        .extra-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 5px 15px 12px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .small-btn {
            border: none;
            background: transparent;

            color: var(--text-secondary);

            cursor: pointer;

            padding: 6px;
        }

        .small-btn:hover {
            color: white;
        }

        .volume {
            width: 80px;
            accent-color: var(--accent);
        }

        .youtube-label {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Responsive */

        @media (max-width: 520px) {

            .app {
                padding-bottom: 185px;
            }

            .player {
                bottom: 8px;
                width: calc(100% - 16px);
                border-radius: 18px;
            }

            .player-main {
                padding: 11px;
            }

            .player-btn {
                width: 35px;
                height: 35px;
            }

            .player-btn.primary {
                width: 41px;
                height: 41px;
            }

            .player-art {
                width: 44px;
                height: 44px;
            }

            .volume {
                width: 65px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="blob one"></div>
        <div class="blob two"></div>
    </div>

    <div class="app">

        <!-- Header -->

        <header>
            <div class="logo">
                Echo Music
            </div>

            <div class="version">
                WEB
            </div>
        </header>

        <!-- Backend status -->

        <div class="backend-status">

            <div
                class="status-dot"
                id="statusDot">
            </div>

            <span id="statusText">
                Connecting to backend...
            </span>

        </div>

        <!-- Search -->

        <div class="search-container">

            <div class="search-wrapper">

                <input
                    id="searchInput"
                    class="search-box"
                    type="text"
                    placeholder="Search songs, artists..."
                    autocomplete="off"
                >

                <div class="search-icon">

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>

                </div>

            </div>

            <button
                class="search-btn"
                id="searchBtn"
                onclick="searchSongs()"
            >
                Search
            </button>

        </div>

        <!-- Content -->

        <main class="content">

            <div class="section-header">

                <h2
                    class="section-title"
                    id="sectionTitle"
                >
                    Trending Now
                </h2>

                <span
                    class="result-count"
                    id="resultCount"
                ></span>

            </div>

            <div
                class="song-list"
                id="songList"
            >

                <div class="loading">

                    <div class="spinner"></div>

                    Loading music...

                </div>

            </div>

        </main>

    </div>

    <!-- Player -->

    <div
        class="player"
        id="player"
    >

        <!-- Embedded YouTube player -->

        <div
            class="youtube-container"
            id="youtubeContainer"
        >

            <div id="youtubePlayer"></div>

            <button
                class="close-video"
                onclick="toggleVideo()"
                title="Hide video"
            >
                ✕
            </button>

        </div>

        <!-- Player information -->

        <div class="player-main">

            <div class="player-art">

                <img
                    id="playerArt"
                    src=""
                    alt=""
                >

            </div>

            <div class="player-info">

                <div
                    class="player-title"
                    id="playerTitle"
                >
                    Select a song
                </div>

                <div
                    class="player-artist"
                    id="playerArtist"
                >
                    —
                </div>

            </div>

            <div class="player-buttons">

                <button
                    class="player-btn"
                    onclick="previousSong()"
                    title="Previous"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path d="M6 5h2v14H6zM20 6v12L9 12z"/>
                    </svg>
                </button>

                <button
                    class="player-btn primary"
                    id="mainPlayButton"
                    onclick="togglePlay()"
                    title="Play/Pause"
                >
                    <svg
                        id="playIcon"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>

                <button
                    class="player-btn"
                    onclick="nextSong()"
                    title="Next"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path d="M16 5h2v14h-2zM4 6v12l11-6z"/>
                    </svg>
                </button>

            </div>

        </div>

        <!-- Progress -->

        <div class="progress-container">

            <div
                class="progress-bar"
                id="progressBar"
                onclick="seek(event)"
            >

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>

        <!-- Extra controls -->

        <div class="extra-controls">

            <div class="control-group">

                <button
                    class="small-btn"
                    onclick="toggleVideo()"
                    title="Show/Hide video"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path d="M4 5h11a2 2 0 0 1 2 2v2.2l3-1.7v9l-3-1.7V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>
                    </svg>
                </button>

                <span class="youtube-label">
                    YouTube Player
                </span>

            </div>

            <div class="control-group">

                <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    style="color:#9ca3af"
                >
                    <path d="M4 9v6h4l5 4V5L8 9H4z"/>
                </svg>

                <input
                    class="volume"
                    id="volume"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                    onchange="changeVolume()"
                >

            </div>

        </div>

    </div>

    <!-- YouTube IFrame API -->

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>

        /* =========================================================
           Configuration
        ========================================================= */

        const API_URL = window.location.origin;

        let currentSongs = [];
        let currentIndex = -1;
        let currentSongId = null;

        let player = null;
        let playerReady = false;

        let isPlaying = false;

        let progressTimer = null;

        /* =========================================================
           YouTube Player API
        ========================================================= */

        function onYouTubeIframeAPIReady() {

            player = new YT.Player("youtubePlayer", {

                width: "100%",
                height: "100%",

                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1
                },

                events: {

                    onReady: function () {

                        playerReady = true;

                        console.log("YouTube player ready");

                    },

                    onStateChange: function (event) {

                        if (event.data === YT.PlayerState.PLAYING) {

                            isPlaying = true;

                            updatePlayButton();

                            startProgressTimer();

                        }

                        else if (
                            event.data === YT.PlayerState.PAUSED
                        ) {

                            isPlaying = false;

                            updatePlayButton();

                            stopProgressTimer();

                        }

                        else if (
                            event.data === YT.PlayerState.ENDED
                        ) {

                            isPlaying = false;

                            updatePlayButton();

                            stopProgressTimer();

                            nextSong();

                        }

                    },

                    onError: function (event) {

                        console.error(
                            "YouTube player error:",
                            event.data
                        );

                        document.getElementById(
                            "playerArtist"
                        ).textContent =
                            "This video cannot be played here.";

                        isPlaying = false;

                        updatePlayButton();

                    }

                }

            });

        }

        /* =========================================================
           Backend status
        ========================================================= */

        async function checkBackend() {

            try {

                const response =
                    await fetch(`${API_URL}/health`);

                if (!response.ok) {
                    throw new Error("Backend unavailable");
                }

                const data = await response.json();

                document.getElementById(
                    "statusText"
                ).textContent =
                    "Backend connected";

                document.getElementById(
                    "statusDot"
                ).classList.remove("error");

                loadTrending();

            }

            catch (error) {

                console.error(error);

                document.getElementById(
                    "statusText"
                ).textContent =
                    "Backend offline";

                document.getElementById(
                    "statusDot"
                ).classList.add("error");

                showError(
                    "Could not connect to the Echo Music backend."
                );

            }

        }

        /* =========================================================
           Trending
        ========================================================= */

        async function loadTrending() {

            showLoading();

            try {

                const response =
                    await fetch(`${API_URL}/trending`);

                if (!response.ok) {
                    throw new Error("Trending request failed");
                }

                const songs =
                    await response.json();

                currentSongs =
                    Array.isArray(songs)
                        ? songs
                        : [];

                currentIndex = -1;

                document.getElementById(
                    "sectionTitle"
                ).textContent =
                    "Trending Now";

                renderSongs(currentSongs);

            }

            catch (error) {

                console.error(
                    "Trending error:",
                    error
                );

                showError(
                    "Failed to load trending songs."
                );

            }

        }

        /* =========================================================
           Search
        ========================================================= */

        async function searchSongs() {

            const input =
                document.getElementById("searchInput");

            const query =
                input.value.trim();

            if (!query) {
                return;
            }

            const button =
                document.getElementById("searchBtn");

            button.disabled = true;

            button.textContent =
                "Searching...";

            showLoading();

            try {

                const response =
                    await fetch(
                        `${API_URL}/search?q=${encodeURIComponent(query)}`
                    );

                if (!response.ok) {
                    throw new Error("Search failed");
                }

                const songs =
                    await response.json();

                currentSongs =
                    Array.isArray(songs)
                        ? songs
                        : [];

                currentIndex = -1;

                document.getElementById(
                    "sectionTitle"
                ).textContent =
                    `Results for "${query}"`;

                renderSongs(currentSongs);

            }

            catch (error) {

                console.error(
                    "Search error:",
                    error
                );

                showError(
                    "Search failed. Please try again."
                );

            }

            finally {

                button.disabled = false;

                button.textContent =
                    "Search";

            }

        }

        /* =========================================================
           Enter key
        ========================================================= */

        document
            .getElementById("searchInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        searchSongs();

                    }

                }
            );

        /* =========================================================
           Render songs
        ========================================================= */

        function renderSongs(songs) {

            const list =
                document.getElementById(
                    "songList"
                );

            document.getElementById(
                "resultCount"
            ).textContent =
                songs.length
                    ? `${songs.length} songs`
                    : "";

            if (!songs.length) {

                list.innerHTML = `
                    <div class="loading">
                        No songs found.
                    </div>
                `;

                return;

            }

            list.innerHTML =
                songs.map(
                    (song, index) => {

                        const title =
                            escapeHtml(
                                song.title ||
                                "Unknown Title"
                            );

                        const artist =
                            escapeHtml(
                                song.artist ||
                                "Unknown Artist"
                            );

                        const thumbnail =
                            song.thumbnail
                                ? escapeHtml(
                                    song.thumbnail
                                )
                                : "";

                        return `

                            <div
                                class="song-item"
                                data-index="${index}"
                                onclick="playSongByIndex(${index})"
                            >

                                <div class="song-art">

                                    ${
                                        thumbnail
                                        ? `
                                            <img
                                                src="${thumbnail}"
                                                alt=""
                                                loading="lazy"
                                            >
                                          `
                                        : "🎵"
                                    }

                                </div>

                                <div class="song-info">

                                    <div class="song-title">
                                        ${title}
                                    </div>

                                    <div class="song-artist">
                                        ${artist}
                                        ${
                                            song.duration
                                            ? " • " +
                                              escapeHtml(
                                                  song.duration
                                              )
                                            : ""
                                        }
                                    </div>

                                </div>

                                <div class="song-play">

                                    <svg
                                        width="17"
                                        height="17"
                                        viewBox="0 0 24 24"
                                        fill="currentColor"
                                    >
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>

                                </div>

                            </div>

                        `;

                    }
                ).join("");

            updateActiveSong();

        }

        /* =========================================================
           Play song
        ========================================================= */

        function playSongByIndex(index) {

            const song =
                currentSongs[index];

            if (!song) {
                return;
            }

            currentIndex = index;

            playSong(song);

        }

        function playSong(song) {

            if (!song || !song.id) {

                console.error(
                    "Invalid song:",
                    song
                );

                return;

            }

            currentSongId =
                song.id;

            /* Update UI */

            document.getElementById(
                "player"
            ).classList.add("active");

            document.getElementById(
                "playerTitle"
            ).textContent =
                song.title ||
                "Unknown Title";

            document.getElementById(
                "playerArtist"
            ).textContent =
                song.artist ||
                "Unknown Artist";

            const artwork =
                document.getElementById(
                    "playerArt"
                );

            if (song.thumbnail) {

                artwork.src =
                    song.thumbnail;

                artwork.style.display =
                    "block";

            }

            updateActiveSong();

            /* Need YouTube player */

            if (!playerReady || !player) {

                document.getElementById(
                    "playerArtist"
                ).textContent =
                    "YouTube player is loading...";

                setTimeout(
                    function() {

                        if (playerReady) {
                            loadYouTubeSong(
                                song.id
                            );
                        }

                    },
                    500
                );

                return;

            }

            loadYouTubeSong(
                song.id
            );

        }

        /* =========================================================
           Load YouTube video
        ========================================================= */

        function loadYouTubeSong(videoId) {

            if (!playerReady || !player) {
                return;
            }

            console.log(
                "Loading YouTube video:",
                videoId
            );

            stopProgressTimer();

            document.getElementById(
                "currentTime"
            ).textContent =
                "0:00";

            document.getElementById(
                "duration"
            ).textContent =
                "0:00";

            document.getElementById(
                "progressFill"
            ).style.width =
                "0%";

            player.loadVideoById({
                videoId: videoId,
                startSeconds: 0
            });

        }

        /* =========================================================
           Play / pause
        ========================================================= */

        function togglePlay() {

            if (!playerReady || !player) {
                return;
            }

            if (!currentSongId) {
                return;
            }

            if (isPlaying) {

                player.pauseVideo();

            }

            else {

                player.playVideo();

            }

        }

        /* =========================================================
           Previous
        ========================================================= */

        function previousSong() {

            if (!currentSongs.length) {
                return;
            }

            let newIndex =
                currentIndex - 1;

            if (newIndex < 0) {

                newIndex =
                    currentSongs.length - 1;

            }

            playSongByIndex(
                newIndex
            );

        }

        /* =========================================================
           Next
        ========================================================= */

        function nextSong() {

            if (!currentSongs.length) {
                return;
            }

            let newIndex =
                currentIndex + 1;

            if (
                newIndex >=
                currentSongs.length
            ) {

                newIndex = 0;

            }

            playSongByIndex(
                newIndex
            );

        }

        /* =========================================================
           Update play button
        ========================================================= */

        function updatePlayButton() {

            const icon =
                document.getElementById(
                    "playIcon"
                );

            if (isPlaying) {

                icon.innerHTML = `
                    <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
                `;

            }

            else {

                icon.innerHTML = `
                    <path d="M8 5v14l11-7z"/>
                `;

            }

        }

        /* =========================================================
           Progress timer
        ========================================================= */

        function startProgressTimer() {

            stopProgressTimer();

            progressTimer =
                setInterval(
                    updateProgress,
                    500
                );

        }

        function stopProgressTimer() {

            if (progressTimer) {

                clearInterval(
                    progressTimer
                );

                progressTimer =
                    null;

            }

        }

        function updateProgress() {

            if (
                !playerReady ||
                !player ||
                !player.getDuration
            ) {
                return;
            }

            const duration =
                player.getDuration();

            const current =
                player.getCurrentTime();

            if (!duration) {
                return;
            }

            const percent =
                (current / duration) * 100;

            document.getElementById(
                "progressFill"
            ).style.width =
                `${percent}%`;

            document.getElementById(
                "currentTime"
            ).textContent =
                formatTime(current);

            document.getElementById(
                "duration"
            ).textContent =
                formatTime(duration);

        }

        /* =========================================================
           Seek
        ========================================================= */

        function seek(event) {

            if (
                !playerReady ||
                !player ||
                !player.getDuration
            ) {
                return;
            }

            const bar =
                document.getElementById(
                    "progressBar"
                );

            const rect =
                bar.getBoundingClientRect();

            const position =
                event.clientX -
                rect.left;

            const percent =
                Math.max(
                    0,
                    Math.min(
                        1,
                        position /
                        rect.width
                    )
                );

            const duration =
                player.getDuration();

            player.seekTo(
                duration * percent,
                true
            );

        }

        /* =========================================================
           Volume
        ========================================================= */

        function changeVolume() {

            if (
                !playerReady ||
                !player
            ) {
                return;
            }

            const volume =
                Number(
                    document.getElementById(
                        "volume"
                    ).value
                );

            player.setVolume(
                volume
            );

        }

        /* =========================================================
           Show / hide YouTube video
        ========================================================= */

        function toggleVideo() {

            const container =
                document.getElementById(
                    "youtubeContainer"
                );

            container.classList.toggle(
                "visible"
            );

        }

        /* =========================================================
           Active song
        ========================================================= */

        function updateActiveSong() {

            document
                .querySelectorAll(
                    ".song-item"
                )
                .forEach(
                    function(item) {

                        const index =
                            Number(
                                item.dataset.index
                            );

                        item.classList.toggle(
                            "active",
                            index === currentIndex
                        );

                    }
                );

        }

        /* =========================================================
           Loading
        ========================================================= */

        function showLoading() {

            document.getElementById(
                "songList"
            ).innerHTML = `

                <div class="loading">

                    <div class="spinner"></div>

                    Loading...

                </div>

            `;

        }

        /* =========================================================
           Error
        ========================================================= */

        function showError(message) {

            document.getElementById(
                "songList"
            ).innerHTML = `

                <div class="error">

                    ${escapeHtml(message)}

                </div>

            `;

        }

        /* =========================================================
           Format time
        ========================================================= */

        function formatTime(seconds) {

            seconds =
                Math.floor(
                    Number(seconds) || 0
                );

            const minutes =
                Math.floor(
                    seconds / 60
                );

            const remaining =
                seconds % 60;

            return `${minutes}:${String(
                remaining
            ).padStart(2, "0")}`;

        }

        /* =========================================================
           Escape HTML
        ========================================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(value);

            return div.innerHTML;

        }

        /* =========================================================
           Start
        ========================================================= */

        checkBackend();

    </script>

</body>

</html>
