<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="referrer"
        content="strict-origin-when-cross-origin"
    >

    <title>Echo Music</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b0b0f;
            color: #ffffff;

            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;

            display: flex;
            align-items: center;

            padding: 0 28px;

            border-bottom: 1px solid #24242c;

            background: #101014;

            position: sticky;
            top: 0;

            z-index: 20;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;

            margin-right: 30px;

            white-space: nowrap;
        }

        .logo span {
            color: #ff375f;
        }

        .search-box {
            flex: 1;

            max-width: 600px;

            display: flex;
            align-items: center;

            background: #1c1c23;

            border: 1px solid #303039;

            border-radius: 12px;

            overflow: hidden;
        }

        .search-box input {
            flex: 1;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            padding: 13px 16px;

            font-size: 15px;
        }

        .search-box button {
            border: none;

            background: #ff375f;
            color: white;

            padding: 13px 20px;

            font-weight: bold;
        }

        .search-box button:hover {
            background: #ff5275;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1250px;

            margin: auto;

            padding: 28px;
        }

        .heading {
            font-size: 28px;
            font-weight: 800;

            margin-bottom: 22px;
        }

        .status {
            color: #9999a5;

            margin-bottom: 20px;

            min-height: 20px;
        }

        /* =========================
           PLAYER
        ========================= */

        .player-section {
            display: none;

            margin-bottom: 35px;

            background: #15151b;

            border: 1px solid #292932;

            border-radius: 16px;

            padding: 18px;
        }

        .player-section.active {
            display: block;
        }

        .player-title {
            font-size: 20px;
            font-weight: 700;

            margin-bottom: 14px;
        }

        .player-info {
            color: #aaaab4;

            margin-bottom: 16px;
        }

        .youtube-player {
            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            border-radius: 12px;

            overflow: hidden;
        }

        #youtube-frame {
            width: 100%;
            height: 100%;

            border: none;

            display: block;
        }

        .player-actions {
            display: flex;

            gap: 10px;

            margin-top: 15px;

            flex-wrap: wrap;
        }

        .player-actions button,
        .youtube-link {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 10px 15px;

            border-radius: 9px;

            border: 1px solid #363640;

            background: #202027;

            color: white;

            text-decoration: none;
        }

        .player-actions button:hover,
        .youtube-link:hover {
            background: #2a2a33;
        }

        /* =========================
           RESULTS
        ========================= */

        .results {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(270px, 1fr));

            gap: 18px;
        }

        .song {
            background: #15151b;

            border: 1px solid #282832;

            border-radius: 14px;

            overflow: hidden;

            transition:
                transform .15s ease,
                border-color .15s ease;
        }

        .song:hover {
            transform: translateY(-3px);

            border-color: #484854;
        }

        .thumbnail {
            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: cover;

            display: block;

            background: #222;
        }

        .song-content {
            padding: 15px;
        }

        .song-title {
            font-weight: 700;

            font-size: 16px;

            line-height: 1.4;

            margin-bottom: 7px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .song-artist {
            color: #9999a5;

            font-size: 14px;

            margin-bottom: 14px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .play-button {
            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 10px;

            background: #ff375f;

            color: white;

            font-weight: 700;
        }

        .play-button:hover {
            background: #ff5275;
        }

        .empty {
            color: #777783;

            text-align: center;

            padding: 60px 20px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            display: none;

            padding: 30px;

            text-align: center;

            color: #aaaab4;
        }

        .loading.active {
            display: block;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                height: auto;

                padding: 15px;

                flex-direction: column;

                align-items: stretch;

                gap: 13px;
            }

            .logo {
                margin-right: 0;
            }

            .search-box {
                max-width: none;
            }

            main {
                padding: 18px;
            }

            .heading {
                font-size: 23px;
            }

            .results {
                grid-template-columns: 1fr;
            }

            .player-section {
                padding: 10px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        Echo <span>Music</span>
    </div>

    <form
        class="search-box"
        id="search-form"
    >

        <input
            id="search-input"
            type="search"
            placeholder="Search songs..."
            autocomplete="off"
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

</header>


<main>

    <div class="heading">
        Music
    </div>

    <div
        class="status"
        id="status"
    >
        Search for a song to get started.
    </div>


    <!-- =========================
         YOUTUBE PLAYER
    ========================== -->

    <section
        class="player-section"
        id="player-section"
    >

        <div
            class="player-title"
            id="player-title"
        >
            Nothing playing
        </div>

        <div
            class="player-info"
            id="player-info"
        >
        </div>

        <div class="youtube-player">

            <iframe
                id="youtube-frame"
                title="YouTube Music Player"
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    fullscreen
                "
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>

        </div>

        <div class="player-actions">

            <button
                id="close-player"
                type="button"
            >
                Close Player
            </button>

            <a
                id="youtube-link"
                class="youtube-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open on YouTube
            </a>

        </div>

    </section>


    <div
        class="loading"
        id="loading"
    >
        Searching...
    </div>


    <div
        class="results"
        id="results"
    ></div>

</main>


<script>

    const API_BASE = "";


    const searchForm =
        document.getElementById("search-form");

    const searchInput =
        document.getElementById("search-input");

    const resultsContainer =
        document.getElementById("results");

    const statusElement =
        document.getElementById("status");

    const loadingElement =
        document.getElementById("loading");

    const playerSection =
        document.getElementById("player-section");

    const playerTitle =
        document.getElementById("player-title");

    const playerInfo =
        document.getElementById("player-info");

    const youtubeFrame =
        document.getElementById("youtube-frame");

    const youtubeLink =
        document.getElementById("youtube-link");

    const closePlayer =
        document.getElementById("close-player");


    // =========================================================
    // SEARCH
    // =========================================================

    searchForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const query =
                searchInput.value.trim();

            if (!query) {
                return;
            }

            await searchSongs(query);

        }
    );


    async function searchSongs(query) {

        loadingElement.classList.add("active");

        resultsContainer.innerHTML = "";

        statusElement.textContent =
            `Searching for "${query}"...`;


        try {

            const response =
                await fetch(
                    `${API_BASE}/search?q=${encodeURIComponent(query)}`
                );


            if (!response.ok) {

                throw new Error(
                    `Server returned ${response.status}`
                );

            }


            const data =
                await response.json();


            if (!Array.isArray(data)) {

                throw new Error(
                    data.error ||
                    "Invalid search response"
                );

            }


            console.log(
                "Search results:",
                data
            );


            if (data.length === 0) {

                statusElement.textContent =
                    "No songs found.";

                resultsContainer.innerHTML = `
                    <div class="empty">
                        No results found.<br><br>
                        Try another search such as
                        <b>Alan Walker Faded</b>.
                    </div>
                `;

                return;

            }


            statusElement.textContent =
                `${data.length} result(s) found.`;


            renderResults(data);


        } catch (error) {

            console.error(
                "Search failed:",
                error
            );


            statusElement.textContent =
                "Search failed.";

            resultsContainer.innerHTML = `
                <div class="empty">
                    Could not search for songs.<br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

        } finally {

            loadingElement.classList.remove("active");

        }

    }


    // =========================================================
    // RENDER RESULTS
    // =========================================================

    function renderResults(songs) {

        resultsContainer.innerHTML = "";


        songs.forEach(song => {

            const videoId =
                song.videoId ||
                song.id;


            if (!videoId) {
                return;
            }


            const card =
                document.createElement("article");

            card.className = "song";


            const thumbnail =
                song.thumbnail ||
                `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;


            card.innerHTML = `

                <img
                    class="thumbnail"
                    src="${escapeAttribute(thumbnail)}"
                    alt=""
                    loading="lazy"
                >

                <div class="song-content">

                    <div class="song-title">
                        ${escapeHtml(
                            song.title ||
                            "Unknown Title"
                        )}
                    </div>

                    <div class="song-artist">
                        ${escapeHtml(
                            song.artist ||
                            "Unknown Artist"
                        )}
                    </div>

                    <button
                        class="play-button"
                        type="button"
                    >
                        ▶ Play
                    </button>

                </div>

            `;


            const playButton =
                card.querySelector(".play-button");


            playButton.addEventListener(
                "click",
                function() {

                    playSong(
                        videoId,
                        song.title ||
                        "Unknown Title",
                        song.artist ||
                        "Unknown Artist"
                    );

                }
            );


            resultsContainer.appendChild(card);

        });

    }


    // =========================================================
    // PLAY SONG
    // =========================================================

    function playSong(
        videoId,
        title,
        artist
    ) {

        if (!videoId) {

            alert(
                "This song does not have a valid YouTube video ID."
            );

            return;

        }


        console.log(
            "Playing:",
            videoId
        );


        playerTitle.textContent =
            title;


        playerInfo.textContent =
            artist;


        /*
         * YouTube embedded player.
         *
         * We deliberately do NOT use yt-dlp.
         */

        const origin =
            window.location.origin;


        const embedUrl =
            "https://www.youtube-nocookie.com/embed/" +
            encodeURIComponent(videoId) +
            "?autoplay=1" +
            "&playsinline=1" +
            "&enablejsapi=1" +
            "&origin=" +
            encodeURIComponent(origin);


        youtubeFrame.src =
            embedUrl;


        youtubeLink.href =
            `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;


        playerSection.classList.add("active");


        playerSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    // =========================================================
    // CLOSE PLAYER
    // =========================================================

    closePlayer.addEventListener(
        "click",
        function() {

            youtubeFrame.src = "";

            playerSection.classList.remove(
                "active"
            );

        }
    );


    // =========================================================
    // HTML ESCAPING
    // =========================================================

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    // =========================================================
    // INITIAL SEARCH
    // =========================================================

    searchInput.focus();

</script>

</body>
</html>
